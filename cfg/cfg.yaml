System:
  logLevel: INFO
  logFile: "./forwarder.log"

Inputs:
  - Type: "tail"
    Tag: "app-log"
    Glob: "./logs/file*.log"
    EnableDB: false
    DBFile: "./state.db"

  - Type: "http"
    Tag: "http-log"

Parsers:
  - Type: "json"

Outputs:
  - Type: splunk
    Name: my_splunk_output
    Match: "*"
    Token: ${splunk_token}
    EventIndex: test
